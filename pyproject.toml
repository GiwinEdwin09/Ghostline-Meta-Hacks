[project]
name = "ghostline"
version = "0.1.0"
description = "Film anything that moves; an AI physicist finds the law behind the motion and proves it with a ghost."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=19.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "meta-sam-parser>=0.1.0",
    "modal>=1.6.3",
    "numpy>=2.5.4",
    "openai>=3.40.0",
    "opencv-python-headless>=5.0.0.93",
    "orjson>=3.13.0",
    "pandas>=3.1.0",
    "psycopg[binary,pool]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/ghostline"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
